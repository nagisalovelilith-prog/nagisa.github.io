<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Nagisa | Bio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      color: #fff;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Video nền tối ưu GPU chống lag */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      transform: translateZ(0);
    }

    /* Khung Bio (đã bỏ blur để video chạy mượt) */
    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(15, 15, 25, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    .avatar {
      display: block;
      width: 110px;
      height: 110px;
      margin: 0 auto 14px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.6);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .bio {
      font-size: 0.9rem;
      color: #d1d5db;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Kiểu nút chung */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.25s;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.2);
    }

    /* Màu từng nút */
    .btn-tiktok {
      color: #ff3b6b;
      background: rgba(255, 59, 107, 0.16);
      border: 1.5px solid #ff3b6b;
    }

    .btn-discord {
      color: #7c8cff;
      background: rgba(88, 101, 242, 0.18);
      border: 1.5px solid #6b7cff;
    }

    .btn-purple {
      color: #d946ef;
      background: rgba(217, 70, 239, 0.16);
      border: 1.5px solid #d946ef;
    }

    /* Màu dự phòng (cam, xanh ngọc) nếu sau này thêm nút */
    .btn-orange {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.16);
      border: 1.5px solid #f59e0b;
    }

    .btn-cyan {
      color: #2dd4bf;
      background: rgba(45, 212, 191, 0.16);
      border: 1.5px solid #2dd4bf;
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline poster="https://i.pinimg.com/736x/2f/68/0f/2f680f41b4840b65f6d9f12dcf386f48.jpg">
    <source src="YTSave.to_YouTube_Media_ExEyb-BaFyo_Qingxiao-entrance-cutscene-Full-HD-60FPS-Wuthering-waves-3-5_002_720p%20(online-video-cutter.com).mp4" type="video/mp4">
  </video>

  <div class="card">
    <img src="https://i.pinimg.com/736x/e8/34/af/e834afd04cdcf498637487391b932c33.jpg" referrerpolicy="no-referrer" alt="Avatar" class="avatar">
    <h1>Nagisa</h1>
    <p class="bio">Mình là Nagisa. Đây là góc của mình. Cảm ơn bạn đã ghé qua ✨</p>

    <div class="links">
      <a href="https://www.tiktok.com/@id-cua-ban" target="_blank" class="btn btn-tiktok">
        <i class="fa-brands fa-tiktok"></i> Ghé thăm kênh TikTok
      </a>
      <a href="https://discord.com/users/ID-CUA-BAN" target="_blank" class="btn btn-discord">
        <i class="fa-brands fa-discord"></i> Profile Discord
      </a>
      <a href="https://discord.gg/link-server-cua-ban" target="_blank" class="btn btn-purple">
        <i class="fa-solid fa-server"></i> 🌸 ┊ Jinzhou Garden
      </a>
    </div>
  </div>
</body>
</html>
