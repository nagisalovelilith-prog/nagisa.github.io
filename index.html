<!DOCTYPE html>

  <title>Nagisa | Bio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      color: #fff;
      padding: 20px;
      overflow-x: hidden;
    }
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(20, 20, 30, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .avatar {
      display: block;
      width: 110px;
      height: 110px;
      margin: 0 auto 14px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.6);
    }
    h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .bio { font-size: 0.9rem; color: #d1d5db; margin-bottom: 24px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: block;
      padding: 13px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      transition: 0.25s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
